name: Release

on:
  push:
    tags: ["*"]

# `id-token` and `attestations` exist only for the attestation step below:
# the first mints the OIDC token the signature is bound to, the second writes
# the result to the repository's attestation store. Both are required — with
# either missing the step fails rather than degrading, which is the behaviour
# we want: an unattested asset should not reach a draft release.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      # Runs BEFORE the release is created, so a failed attestation stops the
      # draft appearing at all rather than leaving unverifiable assets on it.
      # All three uploaded files are attested, not just the built one: what a
      # user verifies is the asset they downloaded, and manifest.json and
      # styles.css are downloaded exactly like main.js.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title "$tag" --draft \
            main.js manifest.json styles.css
