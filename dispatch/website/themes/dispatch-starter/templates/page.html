{% extends "base.html" %}
{% block content %}
<article{% if page.extra.lang %} lang="{{ page.extra.lang }}"{% endif %}>
<h1>{{ page.title }}</h1>
{% if page.date %}<p class="meta"><time datetime="{{ page.date }}">{{ page.date }}</time>{% if page.extra.author %} · {{ page.extra.author }}{% endif %}</p>{% endif %}
{{ page.content | safe }}
</article>
{% endblock %}
