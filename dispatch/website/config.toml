# The project website (US00018). Built by `node dispatch/scripts/website.mjs build`, which stages
# this folder together with the converted vault content in the git-ignored `.build/`, and runs Zola
# there. This file is the only site configuration; nothing here may be a local path or a secret.
base_url = "https://kaimys.github.io/obsidian-dispatch"
title = "Dispatch"
description = "A board for Obsidian that gives a small agent-native team a working process, and a chip on every card that sends a coding agent at the work."
default_language = "en"
# The starter theme is Dispatch-scope; this project's own design lives in templates/, sass/ and
# static/ beside this file and overrides the theme file by file (ADR-0035).
theme = "dispatch-starter"
compile_sass = false
build_search_index = false

[extra]
# Links shown on Home. An empty value is left out; no template hard-codes a URL.
social = { linkedin = "", x = "", bluesky = "", github = "https://github.com/kaimys/obsidian-dispatch", directory = "https://community.obsidian.md/plugins/dispatch" }

# Read by website.mjs, not by Zola.
[extra.dispatch]
source = "10_Website"
releases = "08_Delivery_and QA/Releases"
docs = "docs"
docs_order = ["overview", "wiki-structure", "page-types", "skills", "installation"]
